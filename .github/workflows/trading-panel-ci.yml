name: Trading Panel CI

on:
  push:
    branches:
      - fix/trading-ai-analyst-panel
      - fix/jin-visual-candles-pipeline
  pull_request:
    branches:
      - main
    paths:
      - "src/components/trading/**"
      - "src/services/trading/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/trading-panel-ci.yml"

jobs:
  trading-panel-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Trading functional smoke tests
        run: node tests/trading-smoke-test.mjs
      - name: Build application
        run: npm run build
