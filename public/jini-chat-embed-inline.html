<!-- ============================================
     JINI AI Chat — Inline Embed untuk WordPress
     Tampil langsung di bawah navigation menu
     Salin seluruh blok ini ke Custom HTML widget
     JANGAN memasukkan ke Additional CSS
     ============================================ -->

<style>
#jini-chat-inline {
  width: 100%;
  max-width: 1200px;
  margin: 0 auto 24px auto;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  box-sizing: border-box;
}
#jini-chat-panel-inline {
  background: #ffffff;
  border: 1px solid #e5e7eb;
  border-radius: 12px;
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
  overflow: hidden;
  display: flex;
  flex-direction: column;
}
#jini-panel-header-inline {
  background: #dc2626;
  color: #ffffff;
  padding: 16px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
#jini-panel-title-inline {
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 20px;
  font-weight: 700;
  letter-spacing: 0.04em;
}
#jini-panel-icon-inline {
  width: 42px;
  height: 42px;
  background: rgba(255, 255, 255, 0.2);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 24px;
  font-weight: 800;
}
#jini-messages-inline {
  flex: 1;
  overflow-y: auto;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  background: #fafafa;
  min-height: 300px;
  max-height: 400px;
}
.jini-message-inline {
  max-width: 85%;
  padding: 10px 14px;
  border-radius: 12px;
  font-size: 14px;
  line-height: 1.5;
  animation: jini-fade-in-inline 0.3s ease;
}
@keyframes jini-fade-in-inline {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}
.jini-message-inline.user {
  align-self: flex-end;
  background: #dc2626;
  color: #ffffff;
  border-bottom-right-radius: 4px;
}
.jini-message-inline.bot {
  align-self: flex-start;
  background: #f3f4f6;
  color: #1f2937;
  border-bottom-left-radius: 4px;
}
.jini-message-inline.system {
  align-self: center;
  background: transparent;
  color: #6b7280;
  font-size: 12px;
  padding: 4px 8px;
}
.jini-message-inline.bot a {
  color: #dc2626;
  text-decoration: none;
  border-bottom: 1px solid #dc2626;
}
.jini-message-inline.bot a:hover {
  text-decoration: underline;
}
.jini-typing-inline {
  display: flex;
  gap: 4px;
  padding: 2px 0;
}
.jini-typing-inline span {
  width: 8px;
  height: 8px;
  background: #9ca3af;
  border-radius: 50%;
  animation: jini-typing-inline 1.4s infinite ease-in-out both;
}
.jini-typing-inline span:nth-child(1) { animation-delay: -0.32s; }
.jini-typing-inline span:nth-child(2) { animation-delay: -0.16s; }
@keyframes jini-typing-inline {
  0%, 80%, 100% { transform: scale(0.8); opacity: 0.5; }
  40% { transform: scale(1); opacity: 1; }
}
#jini-input-area-inline {
  padding: 16px 20px;
  background: #ffffff;
  border-top: 1px solid #e5e7eb;
  display: flex;
  gap: 10px;
}
#jini-input-inline {
  flex: 1;
  padding: 10px 14px;
  border: 1px solid #d1d5db;
  border-radius: 24px;
  font-size: 14px;
  outline: none;
  transition: border-color 0.2s ease;
}
#jini-input-inline:focus {
  border-color: #dc2626;
}
#jini-send-btn-inline {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: #dc2626;
  color: #ffffff;
  border: none;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  transition: background 0.2s ease;
}
#jini-send-btn-inline:hover {
  background: #b91c1c;
}
#jini-send-btn-inline:disabled {
  background: #9ca3af;
  cursor: not-allowed;
}
#jini-welcome-inline {
  text-align: center;
  padding: 40px 20px;
  color: #6b7280;
}
#jini-welcome-inline svg {
  width: 48px;
  height: 48px;
  color: #dc2626;
  margin-bottom: 12px;
}
#jini-welcome-inline h3 {
  margin: 0 0 8px 0;
  font-size: 18px;
  color: #1f2937;
}
#jini-welcome-inline p {
  margin: 0;
  font-size: 14px;
}
#jini-empty-state-inline {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  color: #9ca3af;
}
@media (max-width: 768px) {
  #jini-chat-inline {
    max-width: 100%;
    margin: 0 auto 16px auto;
  }
  #jini-chat-panel-inline {
    border-radius: 8px;
  }
  #jini-messages-inline {
    padding: 16px;
    min-height: 250px;
    max-height: 350px;
  }
  #jini-input-area-inline {
    padding: 12px 16px;
  }
}
</style>

<div id="jini-chat-inline">
  <div id="jini-chat-panel-inline">
    <div id="jini-panel-header-inline">
      <div id="jini-panel-title-inline">
        <div id="jini-panel-icon-inline">J</div>
        <span>JINI AI</span>
      </div>
    </div>
    <div id="jini-messages-inline"></div>
    <div id="jini-input-area-inline">
      <input type="text" id="jini-input-inline" placeholder="Ketik pertanyaan Anda..." autocomplete="off">
      <button id="jini-send-btn-inline" aria-label="Kirim pesan">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>
    </div>
  </div>
</div>

<script>
(function() {
  var API_BASE = (window.JINI_API_BASE || 'http://127.0.0.1:20200').replace(/\/$/, '');
  var CHAT_ENDPOINT = API_BASE + '/api/jini/chat';

  var panel = document.getElementById('jini-chat-panel-inline');
  var messagesContainer = document.getElementById('jini-messages-inline');
  var input = document.getElementById('jini-input-inline');
  var sendBtn = document.getElementById('jini-send-btn-inline');
  var welcome = document.getElementById('jini-welcome-inline');
  var emptyState = document.getElementById('jini-empty-state-inline');

  var isSending = false;

  function ensureWelcomeElements() {
    if (!welcome) {
      welcome = document.createElement('div');
      welcome.id = 'jini-welcome-inline';
      welcome.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a1 1 0 0 1 1 1v5.59a1 1 0 0 1 1.61.91l2.72 1.36a1 1 0 0 1 .45 1.59l-1.36 2.72a1 1 0 0 1-1.59.45l-5.59-1.19a1 1 0 0 1-1-.91V3a1 1 0 0 1 1-1z"/><path d="M1 12h4m16 0h-4"/></svg><h3>Halo, saya JINI AI</h3><p>Tanya saya tentang berita nasional, hukum, ekonomi, dan topik lainnya.</p>';
      messagesContainer.appendChild(welcome);
    }
    if (!emptyState) {
      emptyState = document.createElement('div');
      emptyState.id = 'jini-empty-state-inline';
      emptyState.style.flex = '1';
      emptyState.style.display = 'flex';
      emptyState.style.flexDirection = 'column';
      emptyState.style.alignItems = 'center';
      emptyState.style.justifyContent = 'center';
      emptyState.style.color = '#9ca3af';
      messagesContainer.appendChild(emptyState);
    }
  }

  function scrollToBottom() {
    messagesContainer.scrollTop = messagesContainer.scrollHeight;
  }

  function addMessage(text, type, sources) {
    ensureWelcomeElements();
    welcome.style.display = 'none';
    emptyState.style.display = 'none';

    var msg = document.createElement('div');
    msg.className = 'jini-message-inline ' + type;
    msg.style.marginBottom = '14px';
    msg.style.opacity = '0';
    msg.style.transition = 'opacity 0.2s ease';

    var bubble = document.createElement('div');
    bubble.style.padding = '10px 14px';
    bubble.style.borderRadius = '12px';
    bubble.style.maxWidth = '85%';
    bubble.style.wordWrap = 'break-word';
    bubble.style.fontSize = '14px';
    bubble.style.lineHeight = '1.5';

    if (type === 'user') {
      bubble.style.background = '#dc2626';
      bubble.style.color = '#ffffff';
      bubble.style.borderBottomRightRadius = '4px';
      bubble.textContent = text;
    } else {
      bubble.style.background = '#f3f4f6';
      bubble.style.color = '#1f2937';
      bubble.style.borderBottomLeftRadius = '4px';
      bubble.innerHTML = text;
    }

    msg.appendChild(bubble);
    messagesContainer.appendChild(msg);

    if (sources && sources.length > 0 && type === 'bot') {
      var srcBox = document.createElement('div');
      srcBox.style.margin = '4px 0 0 6px';
      srcBox.style.fontSize = '12px';
      srcBox.style.color = '#6b7280';
      var srcTitle = document.createElement('div');
      srcTitle.style.fontWeight = '600';
      srcTitle.style.marginBottom = '6px';
      srcTitle.style.color = '#dc2626';
      srcTitle.textContent = '📚 Sumber referensi:';
      srcBox.appendChild(srcTitle);
      var srcList = document.createElement('ul');
      srcList.style.margin = '0';
      srcList.style.paddingLeft = '18px';
      sources.forEach(function(s) {
        var li = document.createElement('li');
        li.style.marginBottom = '4px';
        var a = document.createElement('a');
        a.href = s.url;
        a.textContent = s.title || s.url;
        a.style.color = '#dc2626';
        a.style.textDecoration = 'none';
        a.style.fontSize = '12.5px';
        a.target = '_blank';
        a.rel = 'noopener noreferrer';
        li.appendChild(a);
        srcList.appendChild(li);
      });
      srcBox.appendChild(srcList);
      msg.appendChild(srcBox);
    }

    setTimeout(function() { msg.style.opacity = '1'; }, 10);
    scrollToBottom();
    return msg;
  }

  function setLoading(loading) {
    isSending = loading;
    sendBtn.disabled = loading;
    input.disabled = loading;
    if (loading) {
      sendBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6a6 6 0 1 1 0 12a6 6 0 0 1 0-12z"/></svg>';
      sendBtn.style.background = '#9ca3af';
    } else {
      sendBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>';
      sendBtn.style.background = '#dc2626';
    }
  }

  function showError(msg) {
    addMessage('⚠️ ' + msg, 'bot');
  }

  async function sendMessage() {
    var text = input.value.trim();
    if (!text || isSending) return;

    addMessage(text, 'user');
    input.value = '';
    input.focus();
    setLoading(true);

    var typingMsg = addMessage('JINI sedang mengetik...', 'bot');

    try {
      var response = await fetch(CHAT_ENDPOINT, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text, conversationId: 'jini-inline', searchNews: true })
      });

      typingMsg.remove();

      if (!response.ok) throw new Error('HTTP ' + response.status);

      var data = await response.json();

      if (data.success && data.message) {
        addMessage(data.message, 'bot', data.sources || []);
      } else {
        showError(data.error && data.error.message ? data.error.message : 'Gagal mendapatkan respons dari JINI.');
      }
    } catch (err) {
      typingMsg.remove();
      console.error('[JINI Inline] Error:', err);
      showError('Tidak dapat terhubung ke JINI AI. Pastikan backend UltimateAI sedang berjalan.');
    } finally {
      setLoading(false);
    }
  }

  sendBtn.addEventListener('click', sendMessage);

  input.addEventListener('keypress', function(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  input.addEventListener('input', function() {
    sendBtn.disabled = !input.value.trim() || isSending;
  });

  ensureWelcomeElements();
})();
</script>
