<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JIN :: Live Online Radio & Audio Canvas</title>
  <style>
    :root {
      --bg: #030712;
      --card-bg: rgba(10, 17, 35, 0.9);
      --cyan: #00e5ff;
      --emerald: #10b981;
      --purple: #a855f7;
      --border: rgba(0, 229, 255, 0.25);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: radial-gradient(circle at 50% 20%, #0c1633 0%, #030712 85%);
      color: #e2e8f0;
      font-family: system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      width: 100%;
      max-width: 680px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 28px;
      box-shadow: 0 0 40px rgba(0, 229, 255, 0.15), inset 0 0 20px rgba(0, 229, 255, 0.05);
      backdrop-filter: blur(16px);
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(0, 229, 255, 0.15);
      padding-bottom: 16px;
      margin-bottom: 20px;
    }
    .title-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .pulse-dot {
      width: 10px;
      height: 10px;
      background: var(--emerald);
      border-radius: 50%;
      box-shadow: 0 0 12px var(--emerald);
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(1.2); }
    }
    h1 {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 0.15em;
      color: var(--cyan);
      font-family: monospace;
    }
    .badge {
      font-size: 10px;
      font-weight: 700;
      background: rgba(16, 185, 129, 0.15);
      color: var(--emerald);
      border: 1px solid rgba(16, 185, 129, 0.4);
      padding: 4px 10px;
      border-radius: 20px;
      font-family: monospace;
    }
    .player-screen {
      background: rgba(4, 7, 18, 0.9);
      border: 1px solid rgba(0, 229, 255, 0.2);
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .station-name {
      font-size: 20px;
      font-weight: 700;
      color: #fff;
    }
    .station-desc {
      font-size: 12px;
      color: #94a3b8;
      font-family: monospace;
    }
    .visualizer {
      display: flex;
      align-items: flex-end;
      gap: 4px;
      height: 48px;
      padding-top: 10px;
    }
    .bar {
      flex: 1;
      background: linear-gradient(180deg, var(--cyan) 0%, rgba(0, 229, 255, 0.2) 100%);
      border-radius: 3px;
      height: 4px;
      transition: height 0.1s ease;
    }
    .playing .bar {
      animation: bounce 1.2s infinite ease-in-out alternate;
    }
    .bar:nth-child(2) { animation-delay: 0.15s; }
    .bar:nth-child(3) { animation-delay: 0.3s; }
    .bar:nth-child(4) { animation-delay: 0.45s; }
    .bar:nth-child(5) { animation-delay: 0.6s; }
    .bar:nth-child(6) { animation-delay: 0.25s; }
    .bar:nth-child(7) { animation-delay: 0.5s; }
    .bar:nth-child(8) { animation-delay: 0.35s; }
    .bar:nth-child(9) { animation-delay: 0.1s; }
    .bar:nth-child(10) { animation-delay: 0.4s; }
    @keyframes bounce {
      0% { height: 6px; }
      100% { height: 44px; }
    }
    .controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 24px;
    }
    .btn-play {
      background: linear-gradient(135deg, #00e5ff 0%, #0077ff 100%);
      border: none;
      color: #000;
      font-weight: 800;
      font-size: 14px;
      padding: 12px 28px;
      border-radius: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s;
      box-shadow: 0 0 20px rgba(0, 229, 255, 0.4);
    }
    .btn-play:hover {
      transform: scale(1.03);
      box-shadow: 0 0 30px rgba(0, 229, 255, 0.6);
    }
    .volume-group {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #94a3b8;
      font-size: 12px;
    }
    input[type=range] {
      accent-color: var(--cyan);
      cursor: pointer;
    }
    .station-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .station-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      padding: 12px 16px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .station-item:hover {
      background: rgba(0, 229, 255, 0.08);
      border-color: rgba(0, 229, 255, 0.3);
      transform: translateX(4px);
    }
    .station-item.active {
      background: rgba(0, 229, 255, 0.12);
      border-color: var(--cyan);
      box-shadow: 0 0 15px rgba(0, 229, 255, 0.15);
    }
    .item-title {
      font-weight: 600;
      font-size: 14px;
      color: #f1f5f9;
    }
    .item-meta {
      font-size: 11px;
      color: #64748b;
      font-family: monospace;
    }
    .footer-note {
      text-align: center;
      font-size: 11px;
      color: #64748b;
      font-family: monospace;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="title-group">
        <div class="pulse-dot"></div>
        <h1>JIN LIVE RADIO</h1>
      </div>
      <div class="badge">LIVE STREAM</div>
    </div>

    <div class="player-screen">
      <div class="station-name" id="currentTitle">Prambors FM 102.2</div>
      <div class="station-desc" id="currentDesc">Hits Musik Pop Indonesia & Internasional Terkini</div>
      <div class="visualizer" id="visualizer">
        <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
        <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
      </div>
    </div>

    <div class="controls">
      <button class="btn-play" id="playBtn" onclick="togglePlay()">
        <span id="playIcon">▶</span> <span id="playText">PLAY</span>
      </button>
      <div class="volume-group">
        <span>VOL</span>
        <input type="range" id="volRange" min="0" max="1" step="0.05" value="0.8" oninput="setVolume(this.value)">
      </div>
    </div>

    <div class="station-list" id="stationList"></div>

    <div class="footer-note">Physical Host: F:\radio_live_player.html • Web Host: /radio_live_player.html</div>
  </div>

  <audio id="audioEl" preload="none"></audio>

  <script>
    const STATIONS = [
      {
        id: 'prambors',
        name: 'Prambors FM (Jakarta / Nasional)',
        desc: 'Hits Musik Pop Indonesia & Internasional Terkini',
        url: 'https://masima.sytes.net/prambors'
      },
      {
        id: 'elshinta',
        name: 'Radio Elshinta 90.0 FM',
        desc: 'Berita, Informasi & Aktual Terpercaya 24 Jam',
        url: 'https://stream.elshinta.com/live'
      },
      {
        id: 'rripro3',
        name: 'RRI Pro 3 Nasional',
        desc: 'Jaringan Berita Nasional Suara Nusantara',
        url: 'https://stream-node1.rri.co.id/streaming/33/9033/rripro3.mp3'
      },
      {
        id: 'delta',
        name: 'Delta FM',
        desc: '100% Lagu Enak & Relaxing Music Hits',
        url: 'https://masima.sytes.net/delta'
      },
      {
        id: 'lofi',
        name: 'Chillhop Lo-Fi Study Stream',
        desc: 'Live 24/7 Lo-Fi Beats to Relax / Code to',
        url: 'https://stream.zeno.fm/f3wvbbqmdg8uv'
      },
      {
        id: 'synthwave',
        name: 'Nightwave Plaza Synthwave',
        desc: 'Retro Synthwave & Vaporwave Stream',
        url: 'https://radio.plaza.one/mp3'
      }
    ];

    let currentIdx = 0;
    const audio = document.getElementById('audioEl');
    const playBtn = document.getElementById('playBtn');
    const playIcon = document.getElementById('playIcon');
    const playText = document.getElementById('playText');
    const currentTitle = document.getElementById('currentTitle');
    const currentDesc = document.getElementById('currentDesc');
    const visualizer = document.getElementById('visualizer');
    const stationList = document.getElementById('stationList');

    function renderStations() {
      stationList.innerHTML = '';
      STATIONS.forEach((s, idx) => {
        const item = document.createElement('div');
        item.className = 'station-item' + (idx === currentIdx ? ' active' : '');
        item.innerHTML = `
          <div>
            <div class="item-title">${s.name}</div>
            <div class="item-meta">${s.desc}</div>
          </div>
          <div style="color: var(--cyan); font-size: 12px; font-weight: 800;">${idx === currentIdx ? '● LIVE' : '▶'}</div>
        `;
        item.onclick = () => selectStation(idx);
        stationList.appendChild(item);
      });
    }

    function selectStation(idx) {
      currentIdx = idx;
      const s = STATIONS[idx];
      currentTitle.innerText = s.name;
      currentDesc.innerText = s.desc;
      renderStations();
      audio.src = s.url;
      audio.play().then(() => updateUI(true)).catch(() => updateUI(false));
    }

    function togglePlay() {
      if (audio.paused) {
        if (!audio.src) audio.src = STATIONS[currentIdx].url;
        audio.play().then(() => updateUI(true)).catch(() => updateUI(false));
      } else {
        audio.pause();
        updateUI(false);
      }
    }

    function updateUI(playing) {
      if (playing) {
        playIcon.innerText = '⏸';
        playText.innerText = 'PAUSE';
        visualizer.classList.add('playing');
      } else {
        playIcon.innerText = '▶';
        playText.innerText = 'PLAY';
        visualizer.classList.remove('playing');
      }
    }

    function setVolume(v) {
      audio.volume = parseFloat(v);
    }

    renderStations();
    audio.src = STATIONS[0].url;
  </script>
</body>
</html>
